<div id="canvas">
    <paintable
      #paintable
      [width] = "width > 1400 ? 548 : 545"
      [height] = "height - 200"
      [active]="active"
      [useEraser]="useEraser"
      [thickness]="3"
      [color]="'black'"
      [image]="image"
      (onSave)="onSave($event)"
      (onLongPress)="onLongPress()"
    >
      <div class="canvas-inner">.</div>
    </paintable>
  </div>
