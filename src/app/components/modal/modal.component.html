<div class="title">
    <h1 st>{{FieldsDialog.title}}</h1>
</div>
<div mat-dialog-content>
    <div *ngIf="FieldsDialog.type == 'cam'; else text">
        <div class="camera">
            <app-camera  [Measusres]="Measures" [isActivated]="false" [needTitle]="false" ></app-camera>
        </div>
        <div class="message">
            <div class="icons" style="margin-top: 5%;">
                <div *ngIf="this.FieldsDialog.randomMessage == 'Vire o rosto para cima.'">
                  <app-faces [direction]="'cima'"></app-faces>
                </div>
                <div *ngIf="this.FieldsDialog.randomMessage == 'Vire o rosto para baixo.'">
                  <app-faces [direction]="'baixo'"></app-faces>
                </div>
                <div *ngIf="this.FieldsDialog.randomMessage == 'Vire o rosto para esquerda.'">
                  <app-faces [direction]="'esq'"></app-faces>
                </div>
                <div *ngIf="this.FieldsDialog.randomMessage == 'Vire o rosto para direta.'">
                  <app-faces [direction]="'dir'"></app-faces>
                </div>
            </div>
            <div>
                <h2>{{FieldsDialog.randomMessage}}</h2>
            </div>
        </div>
    </div>
    <ng-template #text>
        <div *ngIf="FieldsDialog.type == 'one'; else two">
            <div class="img">
                <img  src="../../../assets/img/x.jpg" alt="">
            </div>
            <div class="message">
                <h2>{{FieldsDialog.one}}</h2>
            </div>
        </div>
        <ng-template #two>
            <div class="img">
                <img src="../../../assets/img/x.jpg" alt="">
            </div>
            <div class="message">
                <h2>{{FieldsDialog.two}}</h2>
            </div>
        </ng-template>
    </ng-template>
</div>
<div mat-dialog-actions>
</div>
