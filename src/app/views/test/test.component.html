<div style="position: absolute; top: 0; left: 0; height: 100%; width: 100%;" *ngIf="this.helper.isLoading.getValue()">
    <app-spinner [bg]="true"></app-spinner>
</div>
<div class="backColor" id="colorbg">
    <div id="color25"></div>
    <div id="color75"></div>
</div>
<div class="fullPage">
    <div class="container">
        <div style="
                width: 100%; 
                height: 40px; 
                position: absolute; 
                top: 0; left: 0; 
                background-color: #cccccc; 
                border-radius: 5px 5px 0 0; 
                display: flex; 
                align-items: center; 
                padding-left: 2%; 
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                font-size: 1.1rem;">
            Prova de conhecimentos gerais
        </div>
        <div>
            <div style="display: flex; height: 25%; box-sizing: border-box;">
                <div class="numero" style="margin-right: 3%; font-size: 1.8em;">
                    {{this.prova[numQuest].numero}}
                </div>
                <div class="questao" style="font-size: 1.3em; text-align: justify;">
                    {{this.prova[numQuest].titulo}}
                </div>
            </div>
            <div style="position: absolute; bottom: 250px; left: 8%; width: 85%; " >
                <div *ngFor="let resposta of this.prova[numQuest].respostas"
                    style="background-color: #eaeaea; border-radius: 6px; margin: 3% auto; width: 95%;cursor: pointer;"
                    (click)="this.onClick(resposta[0], numQuest)"
                    id={{resposta[0]}}>
                    <div style="display: flex; width: 100%;">
                        <div
                            style="width: 8%; padding: 2%; background-color: #eaeaea; border-radius: 6px; display: flex; align-items: center; justify-content: center;">
                            <strong>{{resposta[0]}}</strong>
                        </div>
                        <div
                            style="padding: 2%; margin: 3px;background-color: #cccccc; width: 100%; border-radius: 6px;">
                            {{resposta[1]}}
                        </div>
                    </div>
                </div>
            </div>
            <div
                style="position: absolute; bottom: 50px; left: 8%; width: 85%; display: flex; justify-content: space-between;">
                <div style="width: 25%;"><button mat-stroked-button style="width: 100%;" (click)="this.backQuestion()"
                        [disabled]="this.isDisabled" id="back">Voltar</button></div>
                <div style="width: 25%;"><button mat-stroked-button style="width: 100%;" id="unmark">Desmarcar</button>
                </div>
                <div style="width: 25%;"><button mat-stroked-button style="width: 100%;" (click)="this.nextQuestion()"
                        id="next">Avançar</button></div>
            </div>
        </div>
    </div>
</div>
