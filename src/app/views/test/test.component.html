<app-validador-hidden></app-validador-hidden>
<div style="position: absolute; top: 0; left: 0; height: 100%; width: 100%;" *ngIf="this.helper.isLoading.getValue()">
    <app-spinner [bg]="true"></app-spinner>
</div>
<div class="backColor" id="colorbg">
    <div id="color25"></div>
    <div id="color75"></div>
</div>
<app-side-bar *ngIf="!isFinished" (skecth)="onSkecth($event)" [arrQuestion]="this.arrQuestion" (toEnd)="this.endFromSide()">
</app-side-bar>
<div class="fullPage">
    <div class="container">
        <div style="position: relative">
            <app-cavas></app-cavas>
        </div>
        <div style="
                width: 100%; 
                height: 40px; 
                position: absolute; 
                top: 0; left: 0; 
                background-color: #cccccc; 
                border-radius: 5px 5px 0 0; 
                display: flex; 
                align-items: center; 
                padding-left: 2%; 
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                font-size: 1.1rem;
                font-weight: 500;">
            Prova de conhecimentos gerais
        </div>
        <div *ngIf="!isFinished; else finish">


            <div>
                <div style="display: flex; height: 25%; box-sizing: border-box;">
                    <div class="numero" style="margin-right: 3%; font-size: 1.8em;">
                        {{this.prova[numQuest].numero}}
                    </div>
                    <div class="questao" style="font-size: 1.3em; text-align: justify;">
                        {{this.prova[numQuest].titulo}}
                    </div>
                </div>
                <div style="position: absolute; bottom: 250px; left: 8%; width: 85%; z-index: 100">
                    <div *ngFor="let resposta of this.prova[numQuest].respostas"
                        style="background-color: #cccccc; border-radius: 6px; margin: 3% auto; width: 95%;cursor: pointer;"
                        (click)="this.onClick(resposta[0], numQuest)" class="resp" id={{resposta[0]}}>
                        <div style="display: flex; width: 100%;">
                            <div
                                style="width: 8%; padding: 2%; background-color: #cccccc; border-radius: 6px; display: flex; align-items: center; justify-content: center;">
                                <strong>{{resposta[0]}}</strong>
                            </div>
                            <div
                                style="padding: 2%; margin: 3px;background-color: #eaeaea; width: 100%; border-radius: 6px;">
                                <strong>{{resposta[1]}}</strong>
                            </div>
                        </div>
                    </div>
                </div>
                <div
                    style="position: absolute; bottom: 50px; left: 8%; width: 85%; display: flex; justify-content: space-between; z-index: 160">
                    <div style="width: 25%;"><button mat-stroked-button style="width: 100%;"
                            (click)="this.backQuestion()" [disabled]="this.isDisabled" id="back">Voltar</button></div>
                    <div style="width: 25%;"><button mat-stroked-button style="width: 100%;" id="unmark"
                            (click)="this.onUnMark(numQuest)">Desmarcar</button>
                    </div>
                    <div style="width: 25%;"><button mat-stroked-button style="width: 100%;"
                            (click)="this.nextQuestion()" id="next">Avançar</button></div>
                </div>
            </div>
        </div>
        <ng-template #finish>
            <div *ngIf="semAgradecimentos; else agradecimentos">
                <div style="display: flex; justify-content: space-between; flex-direction: column; height: 95%;">
                    <div style="display: flex; justify-content: space-between;">
                        <div style="display: flex; flex-direction: column">
                            <div style="font-size: 25px; margin-bottom: 3%;">
                                <strong>Participante: {{nomeFinal}}</strong>
                            </div>
                            <div style="font-size: 25px">
                                <strong>CPF: {{cpfFinal}}</strong>
                            </div>
                        </div>
                        <div>
                            <img style="width: 150px; border-radius: 15px;" src={{imgFinal}} alt="">
                        </div>
                    </div>
                    <div class="grid-container">
                        <div class="grid-item" style="border-radius: 5px;" *ngFor="let i of this.arrQuestion">
                            <div></div>{{i[0]+1}}) {{i[1]}}
                        </div>
                    </div>
                </div>
                <div class="buttons"
                    style="display: flex; justify-content: space-between; margin: 34% auto 0 auto; width: 85%;">
                    <button mat-stroked-button style="width: 100px;z-index: 190"
                        (click)="this.backFromEnd()">Não</button>
                    <button (click)="this.semAgradecimentos = false" mat-stroked-button
                        style="background-color: rgb(102, 176, 242); color: white; width: 100px; z-index: 190">Sim</button>
                </div>
            </div>
            <ng-template #agradecimentos>
                <div
                    style="height: 50%; text-align: center; display: flex; justify-content: space-around; flex-direction: column; border: 1px solid #cccccc; border-radius: 5px;">
                    <div>
                        <i class="fa-regular fa-circle-check" style="font-size: 150px; color: #04c464"></i>
                    </div>
                    <div>
                        <h1><strong>Prova Concluida com sucesso!</strong></h1>
                        <h3>Ao Clicar no botão abaixo, você será redirecionado para a tela de login.</h3>
                    </div>
                </div>
                <div class="buttons"
                    style="display: flex; justify-content: center; margin: 30% auto 0 auto; width: 85%;">
                    <button mat-stroked-button
                        style="background-color: rgb(102, 176, 242); color: white; width: 100px;z-index: 190"
                        (click)="this.endTest()">Home</button>
                </div>
            </ng-template>
        </ng-template>
    </div>
</div>
