<div style="position: absolute; top: 0; left: 0; height: 100%; width: 100%;" *ngIf="this.Loading.isLoading.getValue(); else isntLoading">
  <app-spinner [bg]="true"></app-spinner>
</div>
<ng-template #isntLoading>
</ng-template>
<div class="fullPage">
  <div class="container">
    <h1 style="font-weight: 500;">Cadastro</h1>
    <div style="margin-top: 10%;">
      <app-form [formFields]="formFields" (FormEmiter)="listenerForm($event)"></app-form>      
    </div>
    <div class="webCam">
      <button mat-stroked-button color="primary" (click)="openDialog()">
        <div style="display: flex; justify-content: center; align-items: center;">
          <div>Tirar foto</div>
          <div *ngIf="returnImg()" style="display: flex; justify-content: center; align-items: center; margin-left: 5px;">
            <mat-icon style="color: #47c047;">check_circle_outline</mat-icon>
          </div>
        </div>
      </button>
    </div>
    <mat-divider style="margin: 20px 0;"></mat-divider>
    <div class="buttons">
      <a mat-stroked-button href = '/' type="button" style="text-decoration: none;">Voltar</a>
      <button form="form" mat-raised-button color="primary" type="submit">Enviar</button>
    </div>
  </div>
</div>
